# Отступ в 2 пробела — фактический стиль проекта. Файл нужен, чтобы
# случайный `cargo fmt` не переформатировал весь код под умолчание
# rustfmt (4 пробела).
#
# Полного соответствия rustfmt тут нет и не требуется: в паре мест вызовы
# намеренно записаны иначе, чем он предлагает. Поэтому проверка
# форматирования в CI не стоит — там проверяется компиляция.
tab_spaces = 2
