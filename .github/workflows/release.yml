name: Release

# Публикуем НЕ в GitHub Releases (тот же урок, что и с GitHub Pages для самого
# дашборда — часть пользователей в РФ не открывает github.io/githubusercontent
# без VPN). GitHub Actions используем только как бесплатный компьютер для
# сборки; установщики и манифест автообновления заливаем в Yandex Object
# Storage (бакет knm-dashboard-app, публичный на чтение).

on:
  push:
    tags:
      - 'v*'

# Токен GitHub здесь не нужен: всё уезжает в Object Storage, в сам репозиторий
# workflow ничего не пишет. Меньше прав — меньше того, что может утечь вместе
# с ключом подписи, который тут же лежит в переменных окружения сборки.
permissions:
  contents: read

# Два релиза одновременно (сломанный тег и следом исправленный) не должны
# пересекаться: latest.json собирается из фрагментов обеих платформ, и взять
# фрагмент от чужой версии значит выдать пользователям ссылку с чужой подписью.
concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_RELEASER_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_RELEASER_SECRET }}
  AWS_DEFAULT_REGION: ru-central1
  S3_ENDPOINT: https://storage.yandexcloud.net
  BUCKET: knm-dashboard-app

jobs:
  # Ворота перед сборкой: версия в package.json, tauri.conf.json, Cargo.toml,
  # Cargo.lock и в теге должна совпадать. Раньше их разъезд ничем себя не
  # выдавал — установщик уезжал в бакет с одной версией, манифест
  # автообновления с другой.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сверка версий с тегом
        run: python3 .github/scripts/check_version.py --tag "$GITHUB_REF_NAME"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            fragment: windows
            rust-targets: ''
            build-args: ''
          - platform: macos-latest
            fragment: macos
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            build-args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Сторонние экшены прибиты к коммиту, а не к плавающему тегу: в этой
      # джобе в окружении лежит приватный ключ подписи автообновления и ключи
      # от бакета, а тег автор экшена может передвинуть в любой момент.
      # Экшены самого GitHub (actions/*) оставлены на мажорных тегах.
      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # ветка stable на 11.08.2026
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Зависимости
        run: npm ci

      - name: Сборка (подписанные артефакты автообновления)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: ${{ matrix.build-args }}

      - name: Публикация установщика в Yandex Object Storage (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="v${VERSION}"
          AWS="aws --endpoint-url $S3_ENDPOINT"

          EXE=$(python3 .github/scripts/find_bundle.py "bundle/nsis/*.exe")
          [ -n "$EXE" ] || { echo "::error::NSIS .exe не найден в src-tauri/target"; exit 1; }
          SIG="$EXE.sig"

          $AWS s3 cp "$EXE" "s3://$BUCKET/$PREFIX/$(basename "$EXE")" --content-type application/octet-stream
          $AWS s3 cp "$SIG" "s3://$BUCKET/$PREFIX/$(basename "$SIG")" --content-type text/plain

          EXE_URL="https://storage.yandexcloud.net/$BUCKET/$PREFIX/$(basename "$EXE")"
          python3 .github/scripts/make_fragment.py \
            --out "fragment-${{ matrix.fragment }}.json" --url "$EXE_URL" --sig-file "$SIG" \
            --key windows-x86_64

      - name: Публикация установщика в Yandex Object Storage (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="v${VERSION}"
          AWS="aws --endpoint-url $S3_ENDPOINT"

          DMG=$(python3 .github/scripts/find_bundle.py "bundle/dmg/*.dmg")
          APPTAR=$(python3 .github/scripts/find_bundle.py "bundle/macos/*.app.tar.gz")
          [ -n "$DMG" ] || { echo "::error::.dmg не найден в src-tauri/target"; exit 1; }
          [ -n "$APPTAR" ] || { echo "::error::.app.tar.gz (updater-артефакт) не найден в src-tauri/target"; exit 1; }
          SIG="$APPTAR.sig"

          $AWS s3 cp "$DMG" "s3://$BUCKET/$PREFIX/$(basename "$DMG")" --content-type application/octet-stream
          $AWS s3 cp "$APPTAR" "s3://$BUCKET/$PREFIX/$(basename "$APPTAR")" --content-type application/gzip
          $AWS s3 cp "$SIG" "s3://$BUCKET/$PREFIX/$(basename "$SIG")" --content-type text/plain

          APPTAR_URL="https://storage.yandexcloud.net/$BUCKET/$PREFIX/$(basename "$APPTAR")"
          python3 .github/scripts/make_fragment.py \
            --out "fragment-${{ matrix.fragment }}.json" --url "$APPTAR_URL" --sig-file "$SIG" \
            --key darwin-x86_64 --key darwin-aarch64

      # Фрагмент манифеста едет в следующую джобу артефактом прогона, а не
      # через бакет: файл в бакете переживает и упавший релиз, и соседний
      # прогон, и однажды соберётся манифест из кусков разных версий.
      - name: Фрагмент манифеста — следующей джобе
        uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.fragment }}
          path: fragment-${{ matrix.fragment }}.json
          retention-days: 7
          if-no-files-found: error

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth:0 — нужна полная история тегов для make_changelog.py
          # и текст текущего тега для заметок в манифесте (по умолчанию
          # checkout тянет только сам тег, без остальных).
          fetch-depth: 0

      - name: Забрать фрагменты платформ
        uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          merge-multiple: true
          path: fragments

      - name: Собрать latest.json из фрагментов и опубликовать
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          AWS="aws --endpoint-url $S3_ENDPOINT"

          COUNT=$(find fragments -name '*.json' | wc -l)
          [ "$COUNT" -eq 2 ] || { echo "::error::ожидались фрагменты обеих платформ, найдено $COUNT"; exit 1; }

          # Текст тега уходит в диалог «Доступна новая версия» — до сих пор
          # пользователь видел там только номер версии.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt

          python3 .github/scripts/make_manifest.py \
            --version "$VERSION" --notes-file notes.txt --out latest.json fragments/*.json

          $AWS s3 cp latest.json "s3://$BUCKET/latest.json" \
            --content-type application/json --cache-control no-cache
          # Копия манифеста версии — из неё делается откат (rollback.yml),
          # если релиз оказался неудачным.
          $AWS s3 cp latest.json "s3://$BUCKET/manifests/v${VERSION}.json" \
            --content-type application/json

      - name: Собрать и опубликовать историю версий (changelog.json)
        shell: bash
        run: |
          set -euo pipefail
          AWS="aws --endpoint-url $S3_ENDPOINT"

          python3 .github/scripts/make_changelog.py --out changelog.json

          $AWS s3 cp changelog.json "s3://$BUCKET/changelog.json" \
            --content-type application/json --cache-control no-cache

  # Релиз считается состоявшимся не когда workflow дошёл до конца, а когда
  # обновление реально доступно: манифест отдаёт новую версию, ссылки ведут на
  # файлы этой же версии и файлы скачиваются. Проверяем со стороны, как
  # приложение у пользователя — без ключей от бакета.
  verify:
    needs: publish-manifest
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Проверить опубликованное обновление
        run: |
          python3 .github/scripts/verify_release.py \
            --version "${GITHUB_REF_NAME#v}" \
            --manifest-url "https://storage.yandexcloud.net/$BUCKET/latest.json"
