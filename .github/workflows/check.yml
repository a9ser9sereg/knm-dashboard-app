name: Проверки

# До сих пор единственным workflow был релизный, с триггером по тегу. Значит
# поломка обнаруживалась в момент, когда версия уже объявлена: тег приходилось
# удалять, версию — сжигать. Здесь проверки идут на каждое изменение, до тега.
#
# Репозиторий публичный, минуты Actions на нём не тарифицируются, поэтому
# гонять их на каждый push можно свободно.

on:
  push:
    # ⚠️ Проверено 11.08.2026: с фильтром вида `branches-ignore: []` +
    # `tags-ignore` push не запускал ничего вообще (ни одного run на три
    # пуша подряд). Явный список веток работает; теги сюда не попадают —
    # на них работает release.yml.
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Проверкам хватает чтения: ни комментариев, ни статусов они не пишут.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Версии не разошлись
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_version.py

  rust:
    name: Сборка проходит
    # macOS, а не Linux: приложение собирается только под Windows и macOS, а на
    # Linux ему пришлось бы доставлять webkit2gtk и прочую системную обвязку
    # ради платформы, которая всё равно не выпускается.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Прибито к коммиту, а не к ветке stable: тег и ветку автор экшена может
      # передвинуть в любой момент. На версию самого Rust это не влияет —
      # экшен всё так же ставит текущий stable.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # ветка stable на 11.08.2026
        with:
          components: clippy

      - name: Кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Компиляция и clippy
        working-directory: src-tauri
        # Одной командой вместо cargo check + cargo clippy: clippy и так
        # проверяет сборку, а отдельный check заставлял компилировать крейт
        # дважды.
        #
        # Без -D warnings: замечания видно в логе, но красным они пока не
        # горят. Ужесточить, когда текущие предупреждения будут разобраны.
        run: cargo clippy --locked --all-targets
